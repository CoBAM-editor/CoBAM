name: Validar prototipo del buscador CoBAM

on:
  push:
    branches:
      - prototipo-buscador
  pull_request:
    branches:
      - prototipo-buscador

# Only the newest push should publish the preview; older builds must not
# race and overwrite a newer version of the prototype.
concurrency:
  group: cobam-prototype-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar sintaxis del generador
        run: python -m py_compile prototipo-buscador/generar_catalogo.py

      - name: Probar extracción de fechas y párrafos TEI
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import xml.etree.ElementTree as ET

          source = Path("prototipo-buscador/generar_catalogo.py")
          spec = importlib.util.spec_from_file_location("cobam_catalog", source)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          date = ET.fromstring('<date from="1560-02-01" to="1565-03-04"/>')
          assert module.get_years(date, "", "") == (1560, 1565), "No conserva el intervalo from/to"
          tei = ET.fromstring(
              '<text xmlns="http://www.tei-c.org/ns/1.0"><body><p>Primer párrafo.</p><p>Segundo párrafo.</p></body></text>'
          )
          assert module.body_text(tei) == "Primer párrafo.\n\nSegundo párrafo.", "No conserva la separación de párrafos"
          assert module.normalize_origin_label("Cléveris") == "Cléveris", "No conserva la forma preferida Cléveris"
          assert module.normalize_origin_label("Cléves") == "Cléveris", "No normaliza la variante Cléves"
          assert module.normalize_origin_label("Cleves") == "Cléveris", "No normaliza la variante Cleves"
          assert module.normalize_origin_label("Amberes") == "Amberes", "Ha alterado un origen no relacionado"
          print("Pruebas de intervalos, párrafos y normalización toponímica: correctas.")
          PY

      - name: Generar catálogo desde los XML-TEI
        run: python prototipo-buscador/generar_catalogo.py

      - name: Validar catálogo generado
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("prototipo-buscador/catalogo.json")
          records = json.loads(path.read_text(encoding="utf-8"))
          assert records, "El catálogo está vacío"
          required = {
              "id", "tei_id", "letter_code", "title", "date", "start_year", "end_year",
              "sender", "recipient", "origin", "destination", "language",
              "transcription", "translation", "annotations", "critical_apparatus",
              "commentary", "commentary_html", "source_marked_html", "source_clean_html",
              "translation_html", "apparatus", "footnotes", "facsimile_items", "date_warning",
              "editorial_responsibility", "responsible_person",
              "has_apparatus", "has_footnotes", "repositories", "archive_countries",
              "archive_cities", "shelfmarks", "witnesses", "bibliography", "facsimiles",
              "has_images", "has_transcription", "has_translation", "file", "url", "published_url",
          }
          missing = [r.get("file", "(archivo sin nombre)") for r in records if not required.issubset(r)]
          assert not missing, f"Faltan campos en: {missing[:5]}"
          ids = [r["id"] for r in records]
          assert len(ids) == len(set(ids)), "Hay identificadores TEI duplicados"
          for record in records:
              start, end = record["start_year"], record["end_year"]
              if start is not None and end is not None:
                  assert start <= end, f"Intervalo cronológico invertido: {record['file']}"
              assert record["url"].startswith("https://"), f"URL de XML inesperada: {record['file']}"
              labels = record.get("languages") or []
              assert all(label and label[0] == label[0].upper() for label in labels), f"Etiqueta de idioma sin mayúscula inicial: {record['file']}: {labels}"
              assert len({label.casefold() for label in labels}) == len(labels), f"Idiomas duplicados por mayúsculas/minúsculas: {record['file']}: {labels}"
              assert not record.get("language") or record["language"][0] == record["language"][0].upper(), f"Idioma principal sin mayúscula inicial: {record['file']}"
              for key in ("source_marked_html", "source_clean_html", "translation_html", "commentary_html"):
                  assert "<script" not in record[key].lower(), f"Marcado inesperado en {key}: {record['file']}"
          latin_book = next((r for r in records if r["file"] == "1568 06 14 Libros.xml"), None)
          spanish_book = next((r for r in records if r["file"] == "1569 04 06 Libros.xml"), None)
          assert latin_book and latin_book["languages"] == ["Latín"], "La etiqueta del libro de 1568 debe ser Latín"
          assert spanish_book and spanish_book["languages"] == ["Español"] and spanish_book.get("language_code") == "es", "La etiqueta y el código de idioma del libro de 1569 deben ser Español/es"
          cleveris_1568 = next((r for r in records if r.get("file") == "1568 10 10 CoBAM.xml"), None)
          cleves_1570 = next((r for r in records if r.get("file") == "1570 03 15 CoBAM.xml"), None)
          assert cleveris_1568 and cleveris_1568["origin"] == "Cléveris", "El origen de la carta de 1568 debe mostrarse como Cléveris"
          assert cleves_1570 and cleves_1570["origin"] == "Cléveris", "El origen de la carta de 1570 debe normalizarse a Cléveris"
          sample = next((r for r in records if r["letter_code"].strip() == "1568 08 29"), None)
          assert sample, "No se encuentra la carta de prueba 1568 08 29"
          assert sample["published_url"] == "https://lacorrespondenciadebenitoariasmontano.online/es_es/1568-08-29/"
          assert sample["start_year"] == 1568, "El filtro por año debería seguir la fecha legible de la carta de prueba"
          assert sample["date_warning"], "Debe advertirse el desacuerdo entre @when y la fecha legible de la carta de prueba"
          assert sample["commentary_html"], "Falta el comentario de la carta de prueba"
          assert sample["source_marked_html"] and sample["source_clean_html"], "Falta una de las vistas de la transcripción"
          assert "tei-sic" in sample["source_marked_html"] and "tei-corr" in sample["source_marked_html"], "No se representan sic/corr en la vista marcada"
          assert "tei-sic" not in sample["source_clean_html"], "La vista limpia no debe duplicar la lectura sic"
          assert "tei-corr" not in sample["source_clean_html"] and "tei-expansion" not in sample["source_clean_html"], "La vista limpia no debe mostrar marcado editorial"
          assert sample["translation_html"], "Falta la traducción de la carta de prueba"
          assert sample["apparatus"], "No se ha extraído el aparato crítico"
          assert sample["footnotes"], "No se han extraído las notas"
          assert len(sample["facsimile_items"]) >= 2, "No se han enlazado los folios del documento"
          assert [x["label"] for x in sample["facsimile_items"][:3]] == ["f. 17r", "f. 17v", "f. 28v"], "El orden de la galería no coincide con el orden de facsímiles del TEI"
          print(f"Catálogo válido: {len(records)} cartas; vistas TEI, notas, aparato y galería comprobados.")
          PY

      - name: Preparar catálogo embebido para la vista previa
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          records = json.loads(Path("prototipo-buscador/catalogo.json").read_text(encoding="utf-8"))
          output = Path("prototipo-buscador/catalog-data.js")
          output.write_text(
              "window.COBAM_CATALOG = " + json.dumps(records, ensure_ascii=False, separators=(",", ":")) + ";\n",
              encoding="utf-8",
          )
          print(f"Catálogo de navegador preparado: {len(records)} cartas.")
          PY

      - name: Comprobar estructura de la vista de edición
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("prototipo-buscador/index.html").read_text(encoding="utf-8")
          required = [
              'id="search-view"', 'id="letter-view"', 'id="reader-marked"',
              'id="reader-clean"', 'id="reader-translation"', 'id="reader-footnotes"',
              'function renderLetterPage(r)', 'encodeURIComponent(r.id)',
              'function setEditionTab(name)', 'function openFacsimile(url,label)',
              'function showApparatusPreview(link)', 'data-edition-tab="marked"',
              'data-edition-tab="clean"', 'data-edition-tab="translation"',
              'id="facsimile-lightbox"', 'id="reader-font-larger"',
              'id="decade"', 'function populateDecadeOptions()', 'function decadeMatches(r)',
              'if(!yearMatches(r)||!decadeMatches(r))return false;',
              'byId("decade").addEventListener("change"',
              'byId("decade").value="";byId("year-from").value=""',
              'row.id="apparatus-"+item.number;',
              'titleLink.href=r.published_url||prototypeReaderUrl;',
              'reader.href=r.published_url||prototypeReaderUrl;',
              'Leer carta editada →',
          ]
          missing = [fragment for fragment in required if fragment not in html]
          assert not missing, f"Faltan piezas de la vista de lectura: {missing}"
          print("Vista navegable de edición crítica: estructura presente.")
          PY

      - name: Comprobar sintaxis JavaScript de la interfaz
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("prototipo-buscador/index.html").read_text(encoding="utf-8")
          match = re.search(r"<script>(.*?)</script>", html, re.S)
          assert match, "No se encontró el script de la interfaz"
          Path("/tmp/cobam-prototipo.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/cobam-prototipo.js

      - name: Probar filtro de décadas
        run: |
          node <<'JS'
          const fs = require("fs");
          const assert = require("assert");
          const source = fs.readFileSync("/tmp/cobam-prototipo.js", "utf8");
          const match = source.match(/function decadeMatches\(r\)\{([\s\S]*?)\n\}/);
          assert(match, "No se encontró decadeMatches");
          function matcher(selectedDecade) {
            const byId = () => ({ value: selectedDecade });
            return Function("byId", match[0] + "; return decadeMatches;")(byId);
          }
          assert.strictEqual(matcher("1560")({start_year:1568,end_year:1568}), true, "Una carta de 1568 debe entrar en la década de 1560");
          assert.strictEqual(matcher("1560")({start_year:1559,end_year:1561}), true, "Una datación que abarca 1560 debe entrar en esa década");
          assert.strictEqual(matcher("1570")({start_year:1568,end_year:1572}), true, "Una datación que abarca dos décadas debe entrar en ambas");
          assert.strictEqual(matcher("1570")({start_year:1568,end_year:1569}), false, "Una carta de 1568-1569 no debe entrar en la década de 1570");
          assert.strictEqual(matcher("1560")({start_year:null,end_year:null}), false, "Una carta sin año no debe entrar al filtrar por década");
          assert.strictEqual(matcher("")({start_year:null,end_year:null}), true, "Sin década seleccionada no se deben excluir cartas sin fecha");
          console.log("Filtro por décadas: coincidencia exacta, intervalos y ausencia de fecha comprobados.");
          JS

      - name: Preparar paquete descargable de prueba
        run: |
          mkdir -p build-prototipo
          cp -r prototipo-buscador build-prototipo/
          cd build-prototipo && zip -r ../prototipo-buscador-CoBAM.zip prototipo-buscador

      - name: Configurar GitHub Pages para la vista previa
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar sitio de vista previa
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototipo-buscador

      - name: Publicar vista previa independiente
        if: github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publicar paquete ZIP descargable
        uses: actions/upload-artifact@v4
        with:
          name: prototipo-buscador-CoBAM
          path: prototipo-buscador-CoBAM.zip
          if-no-files-found: error
          retention-days: 14
