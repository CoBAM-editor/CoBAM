name: Validar prototipo del buscador CoBAM

on:
  push:
    branches:
      - prototipo-buscador
  pull_request:
    branches:
      - prototipo-buscador

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar sintaxis del generador
        run: python -m py_compile prototipo-buscador/generar_catalogo.py

      - name: Probar extracción de fechas y párrafos TEI
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import xml.etree.ElementTree as ET

          source = Path("prototipo-buscador/generar_catalogo.py")
          spec = importlib.util.spec_from_file_location("cobam_catalog", source)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          date = ET.fromstring('<date from="1560-02-01" to="1565-03-04"/>')
          assert module.get_years(date, "", "") == (1560, 1565), "No conserva el intervalo from/to"
          tei = ET.fromstring(
              '<text xmlns="http://www.tei-c.org/ns/1.0"><body><p>Primer párrafo.</p><p>Segundo párrafo.</p></body></text>'
          )
          assert module.body_text(tei) == "Primer párrafo.\\n\\nSegundo párrafo.", "No conserva la separación de párrafos"
          print("Pruebas de intervalos cronológicos y párrafos: correctas.")
          PY

      - name: Generar catálogo desde los XML-TEI
        run: python prototipo-buscador/generar_catalogo.py

      - name: Validar catálogo generado
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("prototipo-buscador/catalogo.json")
          records = json.loads(path.read_text(encoding="utf-8"))
          assert records, "El catálogo está vacío"
          required = {
              "id", "letter_code", "title", "date", "start_year", "end_year",
              "sender", "recipient", "origin", "destination", "language",
              "transcription", "translation", "annotations", "critical_apparatus",
              "repositories", "archive_countries", "archive_cities", "shelfmarks",
              "witnesses", "bibliography", "facsimiles", "has_images",
              "has_transcription", "has_translation", "file", "url",
          }
          missing = [r.get("file", "(archivo sin nombre)") for r in records if not required.issubset(r)]
          assert not missing, f"Faltan campos en: {missing[:5]}"
          ids = [r["id"] for r in records]
          assert len(ids) == len(set(ids)), "Hay identificadores TEI duplicados"
          for record in records:
              start, end = record["start_year"], record["end_year"]
              if start is not None and end is not None:
                  assert start <= end, f"Intervalo cronológico invertido: {record['file']}"
              assert record["url"].startswith("https://"), f"URL de XML inesperada: {record['file']}"
          print(f"Catálogo válido: {len(records)} cartas, identificadores únicos e intervalos comprobados.")
          PY

      - name: Preparar catálogo embebido para la vista previa
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          records = json.loads(Path("prototipo-buscador/catalogo.json").read_text(encoding="utf-8"))
          output = Path("prototipo-buscador/catalog-data.js")
          output.write_text(
              "window.COBAM_CATALOG = " + json.dumps(records, ensure_ascii=False, separators=(",", ":")) + ";\n",
              encoding="utf-8",
          )
          print(f"Catálogo de navegador preparado: {len(records)} cartas.")
          PY

      - name: Comprobar sintaxis JavaScript de la interfaz
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("prototipo-buscador/index.html").read_text(encoding="utf-8")
          match = re.search(r"<script>(.*?)</script>", html, re.S)
          assert match, "No se encontró el script de la interfaz"
          Path("/tmp/cobam-prototipo.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/cobam-prototipo.js

      - name: Preparar paquete descargable de prueba
        run: |
          mkdir -p build-prototipo
          cp -r prototipo-buscador build-prototipo/
          cd build-prototipo && zip -r ../prototipo-buscador-CoBAM.zip prototipo-buscador

      - name: Configurar GitHub Pages para la vista previa
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar sitio de vista previa
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototipo-buscador

      - name: Publicar vista previa independiente
        if: github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publicar paquete ZIP descargable
        uses: actions/upload-artifact@v4
        with:
          name: prototipo-buscador-CoBAM
          path: prototipo-buscador-CoBAM.zip
          if-no-files-found: error
          retention-days: 14
