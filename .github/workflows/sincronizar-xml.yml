name: Sincronizar XML de CoBAM con el buscador

on:
  push:
    branches:
      - main
    paths:
      - '*.xml'
      - '**/*.xml'

permissions:
  contents: write
  actions: write

concurrency:
  group: cobam-xml-sync
  cancel-in-progress: false

jobs:
  sync-xml:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Copiar los XML modificados a prototipo-buscador
        id: sync
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            BEFORE_SHA="$(git rev-parse "$AFTER_SHA^" 2>/dev/null || true)"
          fi
          if [[ -z "$BEFORE_SHA" ]]; then
            echo "No hay commit anterior disponible para calcular los XML modificados."
            exit 1
          fi
          mapfile -t changed_files < <(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- '*.xml' '**/*.xml')
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No hay XML que sincronizar."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin prototipo-buscador
          git checkout -B prototipo-buscador origin/prototipo-buscador
          for file in "${changed_files[@]}"; do
            if git cat-file -e "${AFTER_SHA}:${file}" 2>/dev/null; then
              mkdir -p "$(dirname "$file")"
              git show "${AFTER_SHA}:${file}" > "$file"
              git add -- "$file"
            else
              git rm -f --ignore-unmatch -- "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "Los XML de prototipo-buscador ya coinciden con main."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Sincronizar cambios XML desde main"
          git push origin prototipo-buscador
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Regenerar y publicar el buscador
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/actions/workflows/prototipo-buscador.yml/dispatches" \
            -d '{"ref":"prototipo-buscador"}'
